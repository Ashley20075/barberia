{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta eliminada - BarberSpringfield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body class="login-page">
    <button
    type="button"
    id="themeToggle"
    class="theme-toggle theme-toggle-floating"
    title="Cambiar tema"
    aria-label="Cambiar tema">
    <i class="bi bi-moon-fill"></i>
</button>
    <div class="registro-wrapper">
        <div class="registro-card">
            <div class="text-center mb-4">
                <h1 class="display-5 fw-bold">Barber<span style="color:#C9A87C;">Springfield</span></h1>
            </div>

            <div class="text-center">
                <i class="bi bi-check-circle-fill text-yellow" style="font-size: 3.5rem;"></i>

                <h3 class="mt-3 mb-2">Cuenta eliminada</h3>

                <p class="text-light-brown">
                    Tu cuenta fue eliminada correctamente.
                    Gracias por haber sido parte de BarberSpringfield.
                </p>

                <a href="{% url 'login' %}" class="btn-modern mt-3 d-inline-flex">
                    <i class="bi bi-box-arrow-in-right"></i> Volver al inicio de sesión
                </a>
            </div>

        </div>
    </div>
    <script src="{% static 'js/ui-mejoras.js' %}"></script>
</body>

</html>
