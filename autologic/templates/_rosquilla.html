<svg class="rosquilla-svg{% if ganada %} rosquilla-ganada{% else %} rosquilla-bloqueada{% endif %}" viewBox="0 0 64 64" width="100%" height="100%" aria-hidden="true" focusable="false">
    <defs>
        <radialGradient id="rqMasa" cx="38%" cy="32%" r="75%">
            <stop offset="0" stop-color="#f3c88a"/><stop offset=".55" stop-color="#d9a066"/><stop offset="1" stop-color="#a8642a"/>
        </radialGradient>
        <radialGradient id="rqGlas" cx="35%" cy="30%" r="80%">
            <stop offset="0" stop-color="#ffb3cf"/><stop offset=".6" stop-color="#ff7aa8"/><stop offset="1" stop-color="#e0487f"/>
        </radialGradient>
        <radialGradient id="rqMasaB" cx="38%" cy="32%" r="75%">
            <stop offset="0" stop-color="#a39c90"/><stop offset="1" stop-color="#6d675e"/>
        </radialGradient>
        <radialGradient id="rqGlasB" cx="35%" cy="30%" r="80%">
            <stop offset="0" stop-color="#c9c3b8"/><stop offset="1" stop-color="#9a948a"/>
        </radialGradient>
    </defs>
    <!-- sombra sobre la mesa -->
    <ellipse cx="32" cy="58" rx="22" ry="3.2" fill="#000" opacity=".22"/>

    <circle cx="32" cy="31" r="27" fill="{% if ganada %}url(#rqMasa){% else %}url(#rqMasaB){% endif %}"/>
    <!-- glaseado ondulado -->
    <path fill-rule="evenodd" fill="{% if ganada %}url(#rqGlas){% else %}url(#rqGlasB){% endif %}"

    <!-- brillo del glaseado -->
    <path d="M17 24 Q21 14 32 12.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="{% if ganada %}.55{% else %}.25{% endif %}"/>
    <!-- hueco central con borde de masa -->
    <circle cx="32" cy="31" r="9.2" fill="var(--rq-hueco, #1a1410)" stroke="{% if ganada %}#a8642a{% else %}#6d675e{% endif %}" stroke-width="1.4"/>
    {% if ganada %}
    <!-- chispitas -->
    <rect x="18" y="22" width="6" height="2.4" rx="1.2" transform="rotate(-30 21 23.2)" fill="#fff6a8"/>
    <rect x="40" y="15" width="6" height="2.4" rx="1.2" transform="rotate(25 43 16.2)" fill="#6fe3ff"/>
    <rect x="47" y="30" width="6" height="2.4" rx="1.2" transform="rotate(-50 50 31.2)" fill="#ffffff"/>
    <rect x="44" y="45" width="6" height="2.4" rx="1.2" transform="rotate(35 47 46.2)" fill="#8dff9c"/>
    <rect x="26" y="47" width="6" height="2.4" rx="1.2" transform="rotate(-20 29 48.2)" fill="#ffe14d"/>
    <rect x="15" y="35" width="6" height="2.4" rx="1.2" transform="rotate(60 18 36.2)" fill="#c9a7ff"/>
    <rect x="32" y="12" width="6" height="2.4" rx="1.2" transform="rotate(80 35 13.2)" fill="#fff"/>
    {% endif %}
</svg>
