<svg class="rosquilla-svg{% if ganada %} rosquilla-ganada{% else %} rosquilla-bloqueada{% endif %}" viewBox="0 0 64 64" width="100%" height="100%" aria-hidden="true" focusable="false">
    <!-- masa -->
    <circle cx="32" cy="32" r="26" fill="{% if ganada %}#d9a066{% else %}var(--rq-bloq-masa, #8a8378){% endif %}"/>
    <!-- glaseado con goteo -->
    <path d="M32 9c12 0 21 8 22 19 1 5-3 8-6 6-2 5-6 5-8 1-2 4-6 5-8 1-2 4-6 5-8 1-3 3-8 1-8-4 1-14 7-24 14-24 9-24z"
          fill="{% if ganada %}#ff7aa8{% else %}var(--rq-bloq-glaseado, #b3ada2){% endif %}"/>
    <!-- hueco central -->
    <circle cx="32" cy="32" r="8" fill="var(--rq-hueco, #1a1410)"/>
    {% if ganada %}
    <!-- chispitas -->
    <rect x="16" y="22" width="6" height="2.4" rx="1.2" transform="rotate(-30 19 23)" fill="#fff"/>
    <rect x="40" y="16" width="6" height="2.4" rx="1.2" transform="rotate(25 43 17)" fill="#ffe14d"/>
    <rect x="44" y="34" width="6" height="2.4" rx="1.2" transform="rotate(-50 47 35)" fill="#6fe3ff"/>
    <rect x="22" y="40" width="6" height="2.4" rx="1.2" transform="rotate(40 25 41)" fill="#8dff9c"/>
    <rect x="30" y="17" width="6" height="2.4" rx="1.2" transform="rotate(80 33 18)" fill="#fff"/>
    {% endif %}
</svg>
