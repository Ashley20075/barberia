{% load static %}
    <nav class="navbar-custom">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between w-100 flex-wrap gap-2">

                <div class="navbar-brand-custom">
                    <img src="{% static 'logo.jpeg' %}" alt="Logo">
                    Barber <span>Springfield</span>
                </div>

                <div class="d-flex align-items-center gap-2 flex-wrap">

                    <a href="{% url 'notificaciones:listar' %}" class="nav-bell" title="Notificaciones">
                        <i class="bi bi-bell"></i>
                        {% if notificaciones_no_leidas %}
                            <span class="nav-bell-badge">{{ notificaciones_no_leidas }}</span>
                        {% endif %}
                    </a>

                    <a href="{% url 'administracion:panel_admin' %}" class="nav-btn{% if activo == 'panel' %} active{% endif %}">
                        <i class="bi bi-speedometer2"></i> Panel Admin
                    </a>

                    <a href="{% url 'inventario:dashboard' %}" class="nav-btn{% if activo == 'inventario' %} active{% endif %}">
                        <i class="bi bi-boxes"></i> Inventario
                    </a>

                    <a href="{% url 'administracion:cierre_caja' %}" class="nav-btn{% if activo == 'caja' %} active{% endif %}">
                        <i class="bi bi-cash-coin"></i> Cierre de Caja
                    </a>

                    <button type="button" id="themeToggle" class="theme-toggle" title="Cambiar tema" aria-label="Cambiar tema">
                        <i class="bi bi-moon-fill"></i>
                    </button>

                    <button class="btn-logout-custom"
                            data-bs-toggle="modal"
                            data-bs-target="#modalCerrarSesion">
                        <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                    </button>

                    </div>
            </div>
        </div>
    </nav>
