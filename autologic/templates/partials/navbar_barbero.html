{% load static %}
    <nav class="navbar-custom">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between w-100 flex-wrap gap-2">
                <div class="navbar-brand-custom">
    <img src="{% static 'logo.jpeg' %}" alt="Logo"> Barber <span>Springfield</span>
</div>
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    {% if not es_dia_descanso_hoy %}
                    <a href="{% url 'notificaciones:listar' %}" class="nav-bell" title="Notificaciones">
                        <i class="bi bi-bell"></i>
                        {% if notificaciones_no_leidas %}
                            <span class="nav-bell-badge">{{ notificaciones_no_leidas }}</span>
                        {% endif %}
                    </a>
                    <a href="{% url 'barberos:panel_barbero' %}" class="nav-btn{% if activo == 'panel' %} active{% endif %}">
                        <i class="bi bi-calendar-check"></i> Mis Citas
                    </a>
                    <a href="{% url 'barberos:editar_perfil_barbero' %}" class="nav-btn{% if activo == 'perfil' %} active{% endif %}">
    <i class="bi bi-gear"></i>
    Editar Perfil
</a>
<button
    type="button"
    id="themeToggle"
    class="theme-toggle"
    title="Cambiar tema"
    aria-label="Cambiar tema">
    <i class="bi bi-moon-fill"></i>
</button>
                    {% endif %}
                    <a href="{% url 'logout' %}" class="btn-logout-custom"
                       data-confirmar="¿Estás seguro que deseas cerrar sesión?"
                       data-confirmar-titulo="Cerrar sesión"
                       data-confirmar-boton="Sí, cerrar sesión">
                        <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                    </a>
                </div>
            </div>
        </div>
    </nav>
