{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones - BarberSpringfield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body{% if request.user.is_superuser %} class="tema-admin"{% elif es_barbero %} class="tema-barbero"{% else %} class="tema-cliente"{% endif %}>

    <nav class="navbar-custom">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between w-100 flex-wrap gap-2">
                <a class="navbar-brand-custom" href="{% url 'inicio' %}">
                    <img src="{% static 'logo.jpeg' %}" alt="Logo"> Barber <span>Springfield</span>
                    <span class="role-badge">Notificaciones</span>
                </a>
                <a href="javascript:history.back()" class="nav-btn">
                    <i class="bi bi-arrow-left"></i> Volver
                </a>


    <div class="container py-4">

        <h1 class="mb-4 text-yellow" style="font-family:'Playfair Display',serif;">
            <i class="bi bi-bell"></i> Notificaciones
        </h1>

        <div class="card-custom">
            <div class="table-responsive">
                <table class="table table-custom mb-0">
                    <tbody>
                        {% for n in notificaciones %}
                        <tr>
                            <td style="width: 40px;">
                                {% if not n.leida %}
                                    <i class="bi bi-circle-fill" style="color:#F4C542; font-size: 0.6rem;"></i>
                                {% endif %}
                            </td>
                            <td>
                                {{ n.mensaje }}
                                <div class="text-light-brown small">{{ n.creada|date:"d/m/Y H:i" }}</div>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td class="text-center text-light-brown py-4">
                                No tienes notificaciones todavía.
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/ui-mejoras.js' %}"></script>
</body>
</html>
